name: TestFlight

# Archive the app, sign it, and upload it to App Store Connect, where it appears under
# TestFlight. Started by hand (Actions -> TestFlight -> Run workflow) or by a v* tag.
#
# The archive is built unsigned and signed once, for the App Store, at the export: Xcode's
# automatic, cloud-managed signing makes the distribution certificate and profile. Signing
# the archive itself would need a development profile, and Apple issues one only to a team
# with a registered device. The entitlements (associated domains) are put on the archived app
# before the export, which keeps them, and the signed app is checked for them before upload.
#
# Signing is authorized by an App Store Connect API key held in three repository secrets:
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the issuer ID shown above the keys list
#   ASC_KEY_P8      the whole text of the downloaded AuthKey_<id>.p8 file
# No certificate or profile is kept in this repository. The key is written to the runner's
# temporary directory for the run and removed afterwards; IDs are passed by environment.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: The App Store Connect key, for this run only
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || {
            echo "::error::Set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets"; exit 1; }
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc_key.p8"
      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/MiCyte.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" archive | tail -40
      - name: Put the entitlements on the archived app
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/MiCyte.xcarchive/Products/Applications/App.app"
          test -d "$app"
          if [ -d "$app/Frameworks" ]; then
            find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none \
            --entitlements ios/App/App/App.entitlements "$app"
      - name: Sign for the App Store
        run: |
          set -euo pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MiCyte.xcarchive" \
            -exportOptionsPlist ci/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc_key.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Check the signed app
        run: |
          set -euo pipefail
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa)
          mkdir "$RUNNER_TEMP/ipa" && unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/App.app"
          codesign --verify --deep --strict "$app"
          codesign -dvv "$app" > "$RUNNER_TEMP/signer.txt" 2>&1
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null
          grep -E '^(Authority|TeamIdentifier)=' "$RUNNER_TEMP/signer.txt"
          plutil -p "$RUNNER_TEMP/entitlements.plist"
          grep -q '^Authority=Apple Distribution' "$RUNNER_TEMP/signer.txt" || {
            echo "::error::the app is not signed with an Apple Distribution certificate"; exit 1; }
          grep -q 'applinks:micyte.com' "$RUNNER_TEMP/entitlements.plist" || {
            echo "::error::the signed app lost its associated domains"; exit 1; }
          echo "IPA=$ipa" >> "$GITHUB_ENV"
      - name: Upload
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          cp "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/private_keys/AuthKey_$ASC_KEY_ID.p8"
          API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys" xcrun altool --upload-app -t ios \
            -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It appears in App Store Connect under TestFlight once Apple has processed it."
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc_key.p8" "$RUNNER_TEMP/private_keys"
