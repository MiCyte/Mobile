name: iOS build

# Every push and pull request: build the app for the iOS simulator without signing, launch
# it, and keep a screenshot of what it opened on. No secrets are used here, so a fork's pull
# request runs it too.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -40
      - name: Launch it and take screenshots
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = [d for rt, ds in json.load(sys.stdin)["devices"].items() if "iOS" in rt for d in ds]
          pro = [d for d in devs if "Pro Max" in d["name"]] or [d for d in devs if d["name"].startswith("iPhone")]
          print(pro[-1]["udid"])')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$device" com.micyte.app
          mkdir -p shots
          sleep 25
          xcrun simctl io "$device" screenshot shots/launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots
          path: shots/
